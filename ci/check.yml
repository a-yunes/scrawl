name: Check local-only build
on:
  pull_request:
  push:
    branches: [main, hardening/local-only]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Install Metal compiler
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: python3 scripts/check-local-only.py
      - run: cargo build --locked -j 3
      - run: cargo test --locked -j 3 -- --test-threads=2
      - run: ./scripts/test-grid-backport.sh
      - run: python3 scripts/smoke-local.py --binary target/debug/scrawl
